name: Deploy app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir -p _site/icons
          cp transformation-os.html _site/index.html
          cp transformation-os.html manifest.webmanifest sw.js _site/
          cp icons/*.png _site/icons/
          # New cache name on every deploy so phones pick up the update.
          sed -i "s/const CACHE = 'tos-v1'/const CACHE = 'tos-${GITHUB_SHA::7}'/" _site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
