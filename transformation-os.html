<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Transformation OS">
<meta name="description" content="Offline 16-week athletic transformation tracker: training, running, mess-food nutrition, recovery and progress.">
<title>Transformation OS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
/* ===== Transformation OS — styles ===== */
:root{
  --bg:#0d1117; --bg2:#121923; --card:#161f2b; --card2:#1c2735; --line:#26334a;
  --tx:#e8eef6; --tx2:#a6b3c4; --tx3:#7c8a9e;
  --ac:#4da3ff; --ac2:#2f7fd6; --acTx:#06121f;
  --ok:#3ccf8e; --warn:#f5b041; --bad:#ff6b6b; --info:#8ab4ff; --lime:#b7f34a;
  --rest:#8f7cf7; --mod:#f5b041; --miss:#ff6b6b; --done:#3ccf8e;
  --r:14px; --r2:10px; --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 6px 20px rgba(0,0,0,.25);
  --navH:64px; --safeB:env(safe-area-inset-bottom,0px); --safeT:env(safe-area-inset-top,0px);
  color-scheme:dark;
}
html[data-theme="light"]{
  --bg:#f3f5f9; --bg2:#e9edf3; --card:#ffffff; --card2:#f4f6fa; --line:#d6dde8;
  --tx:#111a26; --tx2:#435166; --tx3:#5f6d82;
  --ac:#1769d1; --ac2:#0f55ad; --acTx:#ffffff;
  --ok:#14955f; --warn:#b26b00; --bad:#cc2f2f; --info:#2a5fcf; --lime:#4d7c0f;
  --rest:#5b45d6; --mod:#b26b00; --miss:#cc2f2f; --done:#14955f;
  --shadow:0 1px 2px rgba(16,24,40,.06), 0 4px 14px rgba(16,24,40,.06);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%;overflow-x:hidden}
h1,h2,h3,h4{margin:0 0 .5rem;line-height:1.2;font-weight:700;letter-spacing:-.01em}
h1{font-size:1.35rem} h2{font-size:1.15rem} h3{font-size:1.02rem} h4{font-size:.95rem;color:var(--tx2)}
p{margin:.3rem 0 .6rem}
a{color:var(--ac)}
small,.small{font-size:.84rem;color:var(--tx2)}
.muted{color:var(--tx2)} .faint{color:var(--tx3)}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---- App shell ---- */
.app{display:flex;min-height:100vh}
.sidenav{display:none}
.main{flex:1;min-width:0;padding-bottom:calc(var(--navH) + var(--safeB) + 70px)}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(8px + var(--safeT)) 12px 8px}
.topbar .row1{display:flex;align-items:center;gap:8px}
.datebtn{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:6px 10px;text-align:center;min-height:48px;cursor:pointer}
.datebtn b{display:block;font-size:1rem}
.datebtn span{font-size:.8rem;color:var(--tx2)}
.iconbtn{min-width:48px;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:1.2rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.savedot{font-size:.72rem;color:var(--tx3);text-align:center;margin-top:4px}
.content{padding:12px;max-width:1180px;margin:0 auto}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg2);border-top:1px solid var(--line);display:flex;padding-bottom:var(--safeB)}
.bottomnav button{flex:1;min-height:var(--navH);background:none;border:0;color:var(--tx3);font-size:.72rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.bottomnav button .ic{font-size:1.25rem;line-height:1}
.bottomnav button[aria-current="page"]{color:var(--ac)}
@media (min-width:900px){
  .sidenav{display:flex;flex-direction:column;gap:4px;width:220px;padding:16px 10px;border-right:1px solid var(--line);background:var(--bg2);position:sticky;top:0;height:100vh}
  .sidenav .brand{font-weight:800;padding:6px 10px 14px;letter-spacing:.02em}
  .sidenav .brand span{color:var(--ac)}
  .sidenav button{display:flex;gap:10px;align-items:center;min-height:44px;padding:8px 12px;border-radius:10px;border:0;background:none;color:var(--tx2);font-size:.95rem;cursor:pointer;text-align:left}
  .sidenav button[aria-current="page"]{background:var(--card);color:var(--tx);box-shadow:inset 3px 0 0 var(--ac)}
  .bottomnav{display:none}
  .main{padding-bottom:90px}
  .content{padding:18px 22px}
}

/* ---- Cards & layout ---- */
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:700px){.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.md2{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1050px){.lg3{grid-template-columns:repeat(3,minmax(0,1fr))}.lg4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);min-width:0}
.card.tight{padding:10px 12px}
.card h3{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card + .card{margin-top:0}
.stack>*+*{margin-top:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.nowrap{flex-wrap:nowrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.sep{height:1px;background:var(--line);margin:10px 0}
.kpi{font-size:1.5rem;font-weight:750;letter-spacing:-.02em}
.kpi small{font-size:.8rem;font-weight:500}
.label{font-size:.76rem;text-transform:uppercase;letter-spacing:.06em;color:var(--tx3);font-weight:650}
.sectionTitle{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 8px}
.sectionTitle h2{margin:0}

/* ---- Buttons & inputs ---- */
.btn{min-height:44px;padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--tx);font-weight:600;font-size:.95rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn:hover{border-color:var(--ac)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--acTx)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#04140c}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:5px 10px;font-size:.85rem;border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:.76rem;font-weight:650;border:1px solid var(--line);background:var(--card2);color:var(--tx2);white-space:nowrap}
.chip.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.chip.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.chip.info{color:var(--info);border-color:color-mix(in srgb,var(--info) 45%,transparent)}
.chip.rest{color:var(--rest);border-color:color-mix(in srgb,var(--rest) 45%,transparent)}
button.chip{cursor:pointer;min-height:36px}
button.chip[aria-pressed="true"]{background:var(--ac);color:var(--acTx);border-color:var(--ac)}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--tx2);min-width:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--tx);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:44px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
input[type="checkbox"],input[type="radio"]{width:24px;height:24px;min-height:24px;accent-color:var(--ac);flex:none}
input[type="range"]{padding:0;accent-color:var(--ac)}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
input[aria-invalid="true"]{border-color:var(--bad)}
.fields{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
.fields.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.fields .full{grid-column:1/-1}
@media (min-width:700px){.fields.c4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.check{display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 2px;cursor:pointer}
.check.done span.t{color:var(--tx3);text-decoration:line-through}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg2)}
.seg button{flex:1;min-height:42px;border:0;background:none;color:var(--tx2);font-weight:600;cursor:pointer;font-size:.88rem;padding:0 6px}
.seg button[aria-pressed="true"]{background:var(--ac);color:var(--acTx)}
.scale{display:flex;gap:4px;flex-wrap:wrap}
.scale button{min-width:40px;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);color:var(--tx);cursor:pointer;font-weight:650}
.scale button[aria-pressed="true"]{background:var(--ac);color:var(--acTx);border-color:var(--ac)}

/* ---- Progress ---- */
.bar{height:10px;border-radius:99px;background:var(--bg2);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--ac);border-radius:99px}
.bar.ok>i{background:var(--ok)} .bar.warn>i{background:var(--warn)} .bar.bad>i{background:var(--bad)}
.ring{--p:0;--c:var(--ac);width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--bg2) 0);display:grid;place-items:center;flex:none}
.ring>span{width:50px;height:50px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:.8rem;font-weight:700}

/* ---- Lists/tables ---- */
.list{list-style:none;margin:0;padding:0}
.list>li{padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.list>li:last-child{border-bottom:0}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th,.tbl td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.tbl th{color:var(--tx3);font-weight:650;font-size:.76rem;text-transform:uppercase;letter-spacing:.04em}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.empty{padding:18px;text-align:center;color:var(--tx2);border:1px dashed var(--line);border-radius:12px;font-size:.92rem}

/* ---- Workout set rows ---- */
.exCard{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--card2)}
.exHead{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.exHead h4{color:var(--tx);margin:0;font-size:1rem}
.setRow{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1fr) minmax(0,.8fr) 46px 36px;gap:6px;align-items:center;margin-top:6px}
.setRow.hdr{font-size:.7rem;color:var(--tx3);text-transform:uppercase;letter-spacing:.04em;margin-top:8px}
.setRow input{padding:8px 6px;text-align:center;min-height:44px}
.setRow .sn{font-weight:700;text-align:center;color:var(--tx2);font-size:.9rem}
.setRow.done input{border-color:color-mix(in srgb,var(--ok) 55%,transparent)}
.setRow.wu .sn{color:var(--warn)}
.setDone{width:46px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);color:var(--tx3);font-size:1.15rem;cursor:pointer}
.setDone[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#04140c}
.setMore{width:36px;height:44px;border:0;background:none;color:var(--tx3);font-size:1.2rem;cursor:pointer}
.suggest{font-size:.82rem;padding:6px 8px;border-radius:8px;background:color-mix(in srgb,var(--ac) 12%,transparent);color:var(--tx);margin-top:6px}

/* ---- Timer dock ---- */
.dock{position:fixed;left:8px;right:8px;bottom:calc(var(--navH) + var(--safeB) + 8px);z-index:29;background:var(--card);border:1px solid var(--ac);border-radius:14px;padding:8px 10px;display:none;align-items:center;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.dock.on{display:flex}
.dock .t{font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums;min-width:76px}
.dock .lbl{font-size:.75rem;color:var(--tx2)}
@media (min-width:900px){.dock{left:auto;right:20px;bottom:20px;width:420px}}

/* ---- Modal ---- */
dialog{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:18px;padding:0;width:min(640px,calc(100vw - 16px));max-height:calc(100vh - 32px);box-shadow:0 20px 60px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(5,8,14,.6)}
.mHead{position:sticky;top:0;background:var(--card);padding:14px 14px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;z-index:2}
.mHead h2{margin:0;font-size:1.08rem}
.mBody{padding:14px}
.mFoot{position:sticky;bottom:0;background:var(--card);padding:10px 14px calc(10px + var(--safeB));border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* ---- Toast ---- */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--navH) + var(--safeB) + 78px);z-index:60;background:var(--tx);color:var(--bg);padding:10px 14px;border-radius:12px;font-weight:600;font-size:.9rem;width:max-content;max-width:calc(100vw - 24px);box-shadow:0 8px 24px rgba(0,0,0,.3);display:none}
.toast.on{display:block}
.toast button{margin-left:10px;background:none;border:0;color:var(--ac);font-weight:800;cursor:pointer;font-size:.9rem}
html[data-theme="dark"] .toast button{color:#0f55ad}

/* ---- Coach ---- */
.coach{border-left:4px solid var(--ac)}
.coach ol{margin:0;padding-left:20px}
.coach li{margin:6px 0}
.why{font-size:.78rem;color:var(--tx3);display:block;margin-top:2px}
.zone{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-weight:750;font-size:.85rem}
.zone.green{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.zone.amber{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.zone.red{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.zone.none{background:var(--bg2);color:var(--tx2)}
.alert{border:1px solid var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent);border-radius:12px;padding:10px 12px;font-size:.9rem}
.note{border:1px solid var(--line);background:var(--bg2);border-radius:12px;padding:10px 12px;font-size:.88rem;color:var(--tx2)}

/* ---- Calendar ---- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dh{font-size:.7rem;text-align:center;color:var(--tx3);font-weight:700;padding:4px 0}
.cal button{min-height:54px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);cursor:pointer;padding:3px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1px;font-size:.85rem}
.cal button .pd{font-size:.62rem;color:var(--tx3)}
.cal button .st{width:8px;height:8px;border-radius:50%;margin-top:2px}
.cal button.out{opacity:.35}
.cal button.today{border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac)}
.cal button.sel{background:var(--card2)}
.st.completed{background:var(--done)} .st.modified{background:var(--mod)} .st.missed{background:var(--miss)} .st.rest{background:var(--rest)} .st.planned{background:var(--tx3)} .st.started{background:var(--ac)} .st.none{background:transparent}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.78rem;color:var(--tx2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle}

/* ---- Charts ---- */
.chart{width:100%;height:auto;display:block}
.chart{max-height:340px}
.chart text{fill:var(--tx3);font-size:11px}
.chart .grid line{stroke:var(--line)}
.chartSum{font-size:.8rem;color:var(--tx2);margin-top:4px}

/* ---- Misc ---- */
.foodItem{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.foodItem:last-child{border-bottom:0}
.foodItem .nm{flex:1;min-width:0}
.foodItem .nm b{font-weight:600;font-size:.93rem;display:block;overflow:hidden;text-overflow:ellipsis}
.foodItem .nm small{display:block}
.qa{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (min-width:700px){.qa{grid-template-columns:repeat(6,minmax(0,1fr))}}
.qa button{min-height:58px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--tx);cursor:pointer;font-weight:650;font-size:.82rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px}
.qa button .ic{font-size:1.2rem}
.photoGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.photoGrid figure{margin:0;position:relative}
.photoGrid img,.cmp img{width:100%;border-radius:10px;display:block;aspect-ratio:3/4;object-fit:cover;background:var(--bg2)}
.photoGrid figcaption{font-size:.7rem;color:var(--tx2);text-align:center}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.badge{display:flex;gap:10px;align-items:center;padding:8px;border-radius:12px;border:1px solid var(--line);background:var(--card2)}
.badge .bi{font-size:1.4rem;width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:var(--bg2)}
.badge.locked{opacity:.45}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;-webkit-overflow-scrolling:touch}
.tabs button{flex:none;min-height:40px;padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--tx2);font-weight:650;cursor:pointer;font-size:.88rem}
.tabs button[aria-selected="true"]{background:var(--ac);color:var(--acTx);border-color:var(--ac)}
details.card>summary{cursor:pointer;font-weight:700;list-style:none;min-height:28px;display:flex;align-items:center;justify-content:space-between}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"▾";color:var(--tx3)}
details.card[open]>summary::after{content:"▴"}
.kbd{font-family:ui-monospace,Menlo,monospace;font-size:.85em;background:var(--bg2);padding:1px 5px;border-radius:5px}
.onb{max-width:720px;margin:0 auto}
.steps{display:flex;gap:4px;margin:6px 0 14px}
.steps i{flex:1;height:5px;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--ac)}
.hide{display:none!important}

.sess>li{flex-wrap:wrap}.sess>li>.grow{flex-basis:100%}.sess>li>.chip{margin-left:auto}

</style>
</head>
<body>
<a class="sr-only" href="#view">Skip to content</a>
<div class="app">
  <nav class="sidenav" id="sidenav" aria-label="Main"></nav>
  <div class="main">
    <header class="topbar">
      <div class="row1">
        <button class="iconbtn" data-act="prevDay" aria-label="Previous day">‹</button>
        <button class="datebtn" data-act="pickDate" aria-label="Choose date or program day"><b id="dateMain">—</b><span id="dateSub"></span></button>
        <button class="iconbtn" data-act="nextDay" aria-label="Next day">›</button>
        <button class="iconbtn hide" id="todayBtn" data-act="goToday" aria-label="Jump to today" style="font-size:.8rem;font-weight:700">Today</button>
      </div>
      <div class="savedot" id="saved" aria-live="polite"></div>
    </header>
    <main class="content" id="view" tabindex="-1"></main>
  </div>
</div>
<nav class="bottomnav" id="bottomnav" aria-label="Main"></nav>
<div class="dock" id="dock" role="timer" aria-live="off">
  <div class="grow"><div class="lbl" id="dockL">Rest</div><div class="t" id="dockT">0:00</div></div>
  <button class="btn sm" data-act="restAdd" data-s="-15" aria-label="Minus 15 seconds">−15</button>
  <button class="btn sm" data-act="restAdd" data-s="15" aria-label="Plus 15 seconds">+15</button>
  <button class="btn sm pri" id="dockP" data-act="restPause">Pause</button>

function seriesFrom(field, from, to){ const out = []; for (let k = from; k <= to; k = addDays(k,1)){ const v = num(dayR(k)[field]); out.push({k, v}); } return out; }
function avgRange(field, endKey, days){ const v = []; for (let i = 0; i < days; i++){ const x = num(dayR(addDays(endKey, -i))[field]); if (isNum(x)) v.push(x); } return {avg:mean(v), n:v.length}; }
function weightTrend(k){

  return {avg:a.avg, n:a.n, prev:b.avg, pn:b.n, delta: (isNum(a.avg) && isNum(b.avg) && a.n >= 3 && b.n >= 3) ? a.avg - b.avg : null};
}
function lastValue(field, k, maxBack=60){ for (let i = 0; i <= maxBack; i++){ const kk = addDays(k, -i); const v = num(dayR(kk)[field]); if (isNum(v)) return {v, k:kk}; } return null; }
function linReg(pts){ // pts [{x,y}]
  const n = pts.length; if (n < 2) return null;
  const mx = mean(pts.map(p=>p.x)), my = mean(pts.map(p=>p.y));
  let sxx = 0, sxy = 0; for (const p of pts){ sxx += (p.x-mx)**2; sxy += (p.x-mx)*(p.y-my); }
  if (!sxx) return null; const slope = sxy / sxx; return {slope, icpt: my - slope*mx};
}
function pearson(xs, ys){
  const n = xs.length; if (n < 3) return null; const mx = mean(xs), my = mean(ys);
  let a = 0, b = 0, c = 0; for (let i = 0; i < n; i++){ a += (xs[i]-mx)*(ys[i]-my); b += (xs[i]-mx)**2; c += (ys[i]-my)**2; }
  return (b && c) ? a / Math.sqrt(b*c) : null;
}

/* ---------- Readiness (transparent, rule-based; not clinically validated) ---------- */
function rhrBaseline(k){ const v = []; for (let i = 1; i <= 14; i++){ const x = num(dayR(addDays(k,-i)).rhr); if (isNum(x)) v.push(x); } return v.length >= 3 ? mean(v) : (num(S.settings.profile.rhr) || null); }
function maxPain(d){ const p = arr(d,'pains'); return p.length ? Math.max(...p.map(x => num(x.sev) || 0)) : 0; }
function redFlags(d){ return arr(d,'pains').flatMap(p => p.flags || []); }
function readiness(k){
  const d = dayR(k), t = targets(), comps = [];
  const sh = num(d.sleepH), sq = num(d.sleepQ), en = num(d.energy), so = num(d.soreness), st = num(d.stress), rhr = num(d.rhr);
  if (isNum(sh)){ let v = clamp(sh / t.sleep, 0, 1) * 100; if (isNum(sq)) v = 0.7*v + 0.3*((sq-1)/4*100); comps.push({n:'Sleep', v, w:30, raw:`${sh} h${isNum(sq)?' · quality '+sq+'/5':''}`}); }
  if (isNum(en)) comps.push({n:'Energy', v:(en-1)/4*100, w:20, raw:`${en}/5`});
  if (isNum(so)) comps.push({n:'Soreness', v:100 - so*10, w:20, raw:`${so}/10`});
  if (isNum(st)) comps.push({n:'Stress', v:(5-st)/4*100, w:15, raw:`${st}/5`});
  const base = rhrBaseline(k);
  if (isNum(rhr) && isNum(base)){ const dl = rhr - base; comps.push({n:'Resting HR trend', v: dl<=2?100: dl<=4?75: dl<=7?45:20, w:15, raw:`${rhr} bpm (${dl>=0?'+':''}${r1(dl)} vs ${r0(base)})`}); }
  const ov = []; let zone = null, score = null;
  const enough = isNum(sh) && comps.length >= 3;
  if (enough){ score = Math.round(sum(comps.map(c => c.v*c.w)) / sum(comps.map(c => c.w))); zone = score >= 70 ? 'green' : score >= 50 ? 'amber' : 'red'; }
  const mp = maxPain(d), fl = redFlags(d), self = num(d.ready);
  if (d.illness) ov.push({z:'red', t:'Illness / unusual symptoms logged — rest or low-intensity only; seek medical advice if symptoms are significant.'});
  if (fl.length) ov.push({z:'red', t:`Pain red flag (${[...new Set(fl)].join(', ')}) — stop the aggravating activity and get it assessed.`});
  else if (mp >= 6) ov.push({z:'red', t:`Pain ${mp}/10 — skip loading/running that provokes it; get assessed if it persists.`});
  else if (mp >= 3) ov.push({z:'amber', t:`Pain ${mp}/10 — use pain-free substitutes and range; no running through pain.`});
  if (self === 1) ov.push({z:'red', t:'Self-rated readiness 1/5 (plan table): rest; seek medical assessment if indicated.'});
  else if (self === 2) ov.push({z:'amber', t:'Self-rated readiness 2/5 (plan table): reduce volume 25–40%.'});
  let finalZone = zone;
  for (const o of ov){ if (o.z === 'red') finalZone = 'red'; else if (o.z === 'amber' && finalZone !== 'red') finalZone = 'amber'; }
  return {score, zone, finalZone, comps, ov, enough, self};
}
const ZONE_TXT = {green:'Green — usual session', amber:'Amber — cut optional work / sets 20–40%, no failure or hard conditioning', red:'Red — rest or low-intensity activity only'};

/* ---------- Training calculations ---------- */
function workingSets(ex){ return (ex.sets || []).filter(s => s.done && !s.wu); }
function e1rm(w, r){ return (isNum(w) && w > 0 && isNum(r) && r > 0) ? w * (1 + r/30) : null; }
function workoutStats(w){
  let planned = 0, done = 0, vol = 0, bwReps = 0;
  for (const ex of w.ex || []){
    const e = exById(ex.exId); planned += ex.optional ? 0 : (ex.pSets || 0);
    for (const s of workingSets(ex)){ done++; if (e.type === 'load' && isNum(s.w) && s.w > 0 && isNum(s.r)) vol += s.w * s.r; if (e.type === 'bw' && isNum(s.r)) bwReps += s.r; }
  }
  return {planned, done, vol, bwReps};
}
function workoutElapsed(w){
  if (!w.startTs) return null; const end = w.endTs || (w.pauseAt || Date.now());
  return Math.max(0, (end - w.startTs - (w.pausedMs || 0)) / 1000);
}
/* Most recent previous log of an exercise (strictly before date k) */
function exHistory(exId, k, limit=1){
  const out = []; const keys = Object.keys(S.days).filter(x => x < k).sort().reverse();
  for (const kk of keys){
    for (const w of arr(S.days[kk], 'workouts')) for (const ex of w.ex || []) if (ex.exId === exId && workingSets(ex).length){ out.push({k:kk, ex}); if (out.length >= limit) return out; }
  }
  return out;
}
const rirMin = s => { const m = String(s ?? '').match(/\d+/); return m ? +m[0] : null; };
function suggestion(ex, k){
  const e = exById(ex.exId); const h = exHistory(ex.exId, k)[0];
  if (!h) return {t:'No previous log — choose a load that leaves the target RIR on every set.', why:'Needs one logged session to compare.'};
  const ws = workingSets(h.ex); const tr = rirMin(ex.rir);
  const top = ws.every(s => isNum(s.r) && s.r >= ex.repMax);
  const below = ws.some(s => isNum(s.r) && s.r < ex.repMin);
  const rirOk = tr == null || ws.every(s => !isNum(s.rir) || s.rir >= tr);
  const loads = ws.map(s => num(s.w)).filter(isNum); const lw = loads.length ? Math.max(...loads) : null;
  const last = `Last (${fmtDate(h.k,{day:'numeric',month:'short'})}): ${ws.map(s => `${isNum(s.w)&&s.w!==0?fmt(s.w,1)+'×':''}${fmt(s.r,0,'?')}${isNum(s.rir)?' @'+s.rir:''}`).join(', ')}`;
  const why = `Rule: double progression — if all working sets reached ${ex.repMax} reps at target RIR (${ex.rir}), add the smallest practical load; otherwise add reps first.`;
  if (e.type === 'time'){
    return {last, t: top ? `Holds reached ${ex.repMax}s — add 5–10 s or a harder variation.` : `Keep the same hold and build toward ${ex.repMax}s.`, why};
  }
  if (e.type === 'bw'){
    if (top && rirOk){
      if (isNum(lw) && lw < 0) return {last, t:`Reduce assistance by ~2.5–5 kg (to ${fmt(lw + 5 > 0 ? 0 : lw + 5,1)} kg).`, why};
      return {last, t:`All sets at ${ex.repMax}+ — add reps gradually; add load only after clean reps are consistent across sessions.`, why};
    }
    return {last, t: below ? `Keep the same difficulty; aim for ${ex.repMin}+ clean reps per set.` : `Add 1 clean rep to one or two sets.`, why};
  }
  if (!isNum(lw)) return {last, t:'Previous sets had no load recorded — log kg to get load suggestions.', why};
  if (top && rirOk){
    let inc = e.inc || 2.5;
    if (e.comp){ const pct = lw * 0.025; inc = Math.max(inc, Math.ceil(pct / inc) * inc); inc = Math.min(inc, Math.max(e.inc || 2.5, Math.round(lw*0.05/ (e.inc||2.5))*(e.inc||2.5))); }
    return {last, t:`Try ${fmt(lw + inc,1)} kg (+${fmt(inc,1)}) — all sets hit ${ex.repMax} at target RIR.`, why, inc};
  }
  if (top && !rirOk) return {last, t:`Top reps reached but below target RIR — repeat ${fmt(lw,1)} kg with cleaner reps.`, why};
  if (below) return {last, t:`Stay at ${fmt(lw,1)} kg; build every set to ${ex.repMin}+ reps.`, why};
  return {last, t:`Stay at ${fmt(lw,1)} kg; add a rep to some sets (target ${ex.repMax}).`, why};
}

const KM_PER_MI = 1.609344;
function distU(km){ return S.settings.units.dist === 'mi' ? km / KM_PER_MI : km; }
function distIn(v){ return S.settings.units.dist === 'mi' ? v * KM_PER_MI : v; }
const dUnit = () => S.settings.units.dist;
function paceStr(sec, km){ if (!isNum(sec) || !isNum(km) || km <= 0 || sec <= 0) return '—'; const p = sec / distU(km); return `${Math.floor(p/60)}:${pad2(Math.round(p%60)%60)} /${dUnit()}`; }
function runWork(r){ if (!r.iv || !r.iv.length) return null; return sum(r.iv.map(x => (num(x.work)||0) * (num(x.reps)||1))); }
const HARD_TYPES = ['tempo','interval','race/test'];

function hrZones(){ const mx = num(S.settings.hr.max), rs = num(S.settings.hr.rest); if (!mx || !rs || mx <= rs) return null;
  const z = (lo, hi) => `${Math.round(rs + (mx-rs)*lo)}–${Math.round(rs + (mx-rs)*hi)}`; return [['Z1 recovery', z(.5,.6)],['Z2 easy', z(.6,.7)],['Z3 steady', z(.7,.8)],['Z4 threshold', z(.8,.9)],['Z5 hard', z(.9,1)]]; }

/* ---------- Downloads ---------- */
function download(name, text, type='application/json'){
  const blob = new Blob([text], {type}); const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);

/* Platform detection for iPhone / installed Home Screen app */
const IS_IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
/* Export a file: on iPhone/iPad (where downloads are unreliable in Home Screen apps) use the Share sheet
   (Save to Files / Drive / WhatsApp); everywhere else, a normal download. Resolves 'shared' | 'downloaded' | 'cancelled' | 'pending'. */
let pendingShare = null;
async function exportFile(name, text, type='application/json'){
  const useShare = IS_IOS && navigator.share && navigator.canShare;
  if (useShare){
    let file; try { file = new File([text], name, {type}); } catch(e){ file = null; }
    if (file && navigator.canShare({files:[file]})){
      try { await navigator.share({files:[file], title:name}); return 'shared'; }
      catch(e){
        if (e && e.name === 'AbortError') return 'cancelled';
        if (e && e.name === 'NotAllowedError'){ // needs a fresh tap (e.g. after reading photos)
          return new Promise(res => { pendingShare = {file, name, text, type, res};
            openModal('Backup ready', `<p><b>${esc(name)}</b> is ready (${fmt(text.length/1024)} KB).</p><p class="small">Tap Share, then choose <b>Save to Files</b>, Google Drive or another safe place.</p>`,
              `<button class="btn" data-act="shareCancel">Cancel</button><button class="btn" data-act="shareDownload">Download instead</button><button class="btn pri" data-act="shareNow">Share / Save</button>`); });
        }
      }
    }
  }
  download(name, text, type); return 'downloaded';
}
ACT.shareNow = async () => { const p = pendingShare; if (!p) return closeModal(); try { await navigator.share({files:[p.file], title:p.name}); closeModal(); pendingShare = null; p.res('shared'); } catch(e){ if (e && e.name === 'AbortError') return; closeModal(); pendingShare = null; download(p.name, p.text, p.type); p.res('downloaded'); } };
ACT.shareDownload = () => { const p = pendingShare; closeModal(); pendingShare = null; if (p){ download(p.name, p.text, p.type); p.res('downloaded'); } };
ACT.shareCancel = () => { const p = pendingShare; closeModal(); pendingShare = null; if (p) p.res('cancelled'); };
function csv(rows){ return rows.map(r => r.map(c => { const s = c == null ? '' : String(c); return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; }).join(',')).join('\n'); }

/* ---------- Audio / vibration ---------- */
let actx = null;
function unlockAudio(){ if (actx || !S || !S.settings.sound) return; try { const C = window.AudioContext || window.webkitAudioContext; if (C){ actx = new C(); } } catch(e){} }
function beep(n=3){
  if (S.settings.vibrate && navigator.vibrate) { try { navigator.vibrate([200,100,200]); } catch(e){} }
  if (!S.settings.sound) return;
  try { if (!actx) unlockAudio(); if (!actx) return; actx.resume && actx.resume();
    for (let i = 0; i < n; i++){ const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(actx.destination);
      const t0 = actx.currentTime + i * 0.28; g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.4, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.2); o.start(t0); o.stop(t0 + 0.22); }
  } catch(e){}
}

/* ---------- Timers (timestamp-based so they stay correct if the tab is suspended) ---------- */
function T(){ S.timers = S.timers || {}; return S.timers; }
function restRemaining(){ const r = T().rest; if (!r) return null; return r.running ? Math.max(0, (r.endAt - Date.now()) / 1000) : r.remaining; }
function startRest(sec, label){ T().rest = {total:sec, endAt:Date.now() + sec*1000, remaining:sec, running:true, label:label || 'Rest', fired:false}; save(); tick(); }
ACT.restPause = () => { const r = T().rest; if (!r) return; if (r.running){ r.remaining = restRemaining(); r.running = false; } else { r.endAt = Date.now() + r.remaining*1000; r.running = true; r.fired = false; } save(); tick(); };
ACT.restAdd = el => { const r = T().rest; if (!r) return; const d = +el.dataset.s; if (r.running) r.endAt += d*1000; else r.remaining = Math.max(0, r.remaining + d); r.total += d; r.fired = false; save(); tick(); };
ACT.restReset = () => { const r = T().rest; if (!r) return; r.remaining = r.total; r.running = false; r.fired = false; save(); tick(); };
ACT.restClose = () => { delete T().rest; save(); tick(); };
ACT.restStart = el => { const s = num(el.dataset.s) || num(mval('restCustom')) || num(($('#restCustom')||{}).value); if (!isNum(s) || s <= 0) return toast('Enter seconds.'); startRest(s, 'Rest'); };
function swElapsed(){ const s = T().sw; if (!s) return 0; return (s.acc + (s.running ? Date.now() - s.runStart : 0)) / 1000; }
ACT.swToggle = () => { const s = T().sw || (T().sw = {acc:0, running:false}); if (s.running){ s.acc += Date.now() - s.runStart; s.running = false; } else { s.runStart = Date.now(); s.running = true; } save(); tick(); render(); };
ACT.swReset = () => { T().sw = {acc:0, running:false}; save(); render(); };
/* Interval timer: blocks [{l, s}] */
function ivElapsed(){ const v = T().iv; if (!v) return 0; return (v.acc + (v.running ? Date.now() - v.runStart : 0)) / 1000; }
function ivState(){
  const v = T().iv; if (!v) return null; const e = ivElapsed(); let c = 0;
  for (let i = 0; i < v.blocks.length; i++){ const b = v.blocks[i]; if (e < c + b.s) return {i, b, rem:c + b.s - e, total:sum(v.blocks.map(x=>x.s)), e}; c += b.s; }
  return {done:true, total:c, e, i:v.blocks.length};
}
function buildBlocks(warm, reps, work, rec, cool){
  const b = []; if (warm > 0) b.push({l:'Warm-up', s:warm});
  for (let i = 1; i <= reps; i++){ b.push({l:`Work ${i}/${reps}`, s:work, hard:true}); if (rec > 0 && i < reps) b.push({l:`Recover ${i}/${reps-1}`, s:rec}); }
  if (cool > 0) b.push({l:'Cool-down', s:cool}); return b;
}
let lastTickInfo = {};
function tick(){
  // Rest dock
  const dock = $('#dock'); const r = T().rest;
  if (r && dock){
    const rem = restRemaining(); dock.classList.add('on');
    $('#dockT').textContent = fmtDur(Math.ceil(rem)); $('#dockL').textContent = `${r.label}${r.running ? '' : ' (paused)'}`;
    $('#dockP').textContent = r.running ? 'Pause' : (rem <= 0 ? 'Done' : 'Resume');
    if (r.running && rem <= 0 && !r.fired){ r.fired = true; r.running = false; r.remaining = 0; save(); beep(3); toast('Rest complete — next set.'); }
  } else if (dock) dock.classList.remove('on');
  // Generic tick targets
  for (const el of $$('[data-tick]')){
    const k = el.dataset.tick;
    if (k === 'sw') el.textContent = fmtDur(swElapsed());
    else if (k === 'wk'){ const w = findWorkout(el.dataset.w); el.textContent = w ? fmtDur(workoutElapsed(w)) : '—'; }
    else if (k === 'iv'){ const st = ivState(); if (!st){ el.innerHTML = ''; continue; }
      if (st.done){ el.innerHTML = `<div class="kpi">Finished</div><div class="small">Total ${fmtDur(st.total)}</div>`; }
      else el.innerHTML = `<div class="label">${esc(st.b.l)}${st.b.hard ? ' · HARD (RPE 7–8)' : ''}</div><div class="kpi num" style="font-size:2.4rem">${fmtDur(Math.ceil(st.rem))}</div><div class="small">Elapsed ${fmtDur(st.e)} of ${fmtDur(st.total)}</div>${bar(st.e, st.total)}`;
      const v = T().iv; if (v && v.running){ if (lastTickInfo.iv !== undefined && lastTickInfo.iv !== st.i){ beep(st.done ? 3 : 2); if (st.done){ v.acc += Date.now() - v.runStart; v.running = false; save(); render(); } } }
      lastTickInfo.iv = st.i;
    }
  }
}
setInterval(() => { if (S) tick(); }, 250);
document.addEventListener('visibilitychange', () => { if (!document.hidden && S) tick(); });

/* ---------- Charts (inline SVG, labelled) ---------- */
function lineChart({series, labels, h=180, yUnit='', goal=null, summary=''}){
  const W = 420, H = Math.round(h*0.75), pl = 40, pr = 8, pt = 10, pb = 22;
  const all = series.flatMap(s => s.pts.map(p => p.y)).filter(isNum).concat(isNum(goal) ? [goal] : []);
  if (!all.length) return empty('No data yet for this chart.');
  let mn = Math.min(...all), mx = Math.max(...all); if (mn === mx){ mn -= 1; mx += 1; } const padv = (mx - mn) * 0.08; mn -= padv; mx += padv;
  const n = Math.max(labels.length, 2); const X = i => pl + (W - pl - pr) * (i / (n - 1)); const Y = v => pt + (H - pt - pb) * (1 - (v - mn) / (mx - mn));
  let g = `<g class="grid">`; for (let i = 0; i <= 3; i++){ const v = mn + (mx - mn) * i / 3; g += `<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${pl-4}" y="${Y(v)+3}" text-anchor="end">${fmt(v, Math.abs(mx-mn) < 10 ? 1 : 0)}</text>`; } g += `</g>`;
  const step = Math.ceil(labels.length / 4); let xl = ''; labels.forEach((l, i) => { if (i % step === 0 || i === labels.length - 1) xl += `<text x="${X(i)}" y="${H-6}" text-anchor="${i === 0 ? 'start' : i === labels.length - 1 ? 'end' : 'middle'}">${esc(l)}</text>`; });
  let body = ''; if (isNum(goal)) body += `<line x1="${pl}" x2="${W-pr}" y1="${Y(goal)}" y2="${Y(goal)}" stroke="var(--ok)" stroke-dasharray="5 4"/><text x="${W-pr}" y="${Y(goal)-4}" text-anchor="end" style="fill:var(--ok)">goal ${fmt(goal,1)}</text>`;
  for (const s of series){
    const pts = s.pts.map((p, i) => isNum(p.y) ? [X(i), Y(p.y)] : null);
    if (s.line !== false){ let d = '', pen = false; for (const p of pts){ if (!p){ pen = false; continue; } d += (pen ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); pen = true; } body += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w||2.2}" stroke-linejoin="round" stroke-linecap="round"/>`; }
    if (s.dots) for (const p of pts) if (p) body += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.4" fill="${s.color}" opacity=".75"/>`;
  }
  const legend = series.length > 1 ? `<div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>` : '';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(summary || 'chart')}">${g}${body}${xl}</svg>${legend}${summary ? `<div class="chartSum">${summary}</div>` : ''}`;
}
function barChart({bars, h=170, target=null, summary='', fmtV=v=>fmt(v)}){
  const W = 420, H = Math.round(h*0.75), pl = 40, pr = 8, pt = 12, pb = 22;
  const vals = bars.flatMap(b => [b.v, b.v2]).filter(isNum).concat(isNum(target) ? [target] : []);
  if (!vals.length || Math.max(...vals) <= 0) return empty('No data yet for this chart.');
  const mx = Math.max(...vals) * 1.1; const bw = (W - pl - pr) / bars.length; const Y = v => pt + (H - pt - pb) * (1 - v / mx);
  let g = `<g class="grid">`; for (let i = 0; i <= 3; i++){ const v = mx * i / 3; g += `<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${pl-4}" y="${Y(v)+3}" text-anchor="end">${fmtV(v)}</text>`; } g += '</g>';
  let body = ''; const step = Math.ceil(bars.length / 5);
  bars.forEach((b, i) => {
    const x = pl + i * bw; const two = isNum(b.v2); const w = two ? bw * 0.36 : bw * 0.62;
    if (isNum(b.v2)) body += `<rect x="${x + bw*0.12}" y="${Y(b.v2)}" width="${w}" height="${Math.max(0, H - pb - Y(b.v2))}" rx="3" fill="var(--tx3)" opacity=".55"><title>${esc(b.label)}: ${fmtV(b.v2)}</title></rect>`;
    if (isNum(b.v)) body += `<rect x="${two ? x + bw*0.52 : x + bw*0.19}" y="${Y(b.v)}" width="${w}" height="${Math.max(0, H - pb - Y(b.v))}" rx="3" fill="${b.color || 'var(--ac)'}"><title>${esc(b.label)}: ${fmtV(b.v)}</title></rect>`;
    if (i % step === 0) body += `<text x="${x + bw/2}" y="${H-6}" text-anchor="middle">${esc(b.label)}</text>`;
  });
  if (isNum(target)) body += `<line x1="${pl}" x2="${W-pr}" y1="${Y(target)}" y2="${Y(target)}" stroke="var(--ok)" stroke-dasharray="5 4"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(summary || 'bar chart')}">${g}${body}</svg>${summary ? `<div class="chartSum">${summary}</div>` : ''}`;
}

/* ===== Transformation OS — rule-based coach (no AI; every item shows its rule) ===== */
'use strict';
function hardActs(d){ return arr(d,'acts').filter(a => a.intensity === 'hard'); }
function pendingCore(k){ return planFor(k).sessions.filter(s => s.core && !DONEISH.includes(sessStatus(k, s.key))); }

function coachBrief(k){
  const items = []; const p = planFor(k), d = dayR(k), R = readiness(k), t = targets(), N = dayNut(k);
  const isToday = k === todayKey(); const hour = isToday ? new Date().getHours() : 21;
  /* 1. Session priority */
  if (p.pd === 0) items.push({t:'Day 0 baseline: morning weigh-in, waist at navel, front/side/back photos, resting pulse, pain notes, baseline reps and loads.', why:'Plan §2 — complete before training; keep conditions identical for future comparisons.', act:['Open baseline checklist','goView','settings','profile']});
  else if (p.pre) items.push({t:`Program starts ${fmtDate(S.settings.startDate,{weekday:'long',day:'numeric',month:'short'})} (in ${-p.pd + 1} day${-p.pd + 1 === 1 ? '' : 's'}). Use these days to calibrate logging and complete the Day 0 baseline.`, why:'Program day is counted from the start date set in Settings.'});
  else {
    const pend = pendingCore(k); const hard = hardActs(d);
    const runPend = pend.filter(s => s.kind === 'run');
    if (hard.length && runPend.length) items.push({t:`Hard ${hard.map(a => a.type).join(' + ')} logged — replace the planned run instead of stacking it.`, why:'Plan §3/§12: a hard academy session counts as a hard session; it replaces comparable training.', act:['Replace run with PT','replaceRun', runPend[0].key]});
    if (R.finalZone === 'red') items.push({t:`Readiness RED — rest or low-intensity only today. ${R.ov.length ? R.ov[0].t : ''}`, why:'Rule: pain, illness or red-zone readiness overrides the plan. You can override with a note in Recovery.'});
    else if (pend.length){
      const lbl = pend.map(s => s.label).join(' + ');
      const adj = R.finalZone === 'amber' ? ' Readiness AMBER: keep the main lifts, cut optional work/sets 20–40%, no failure or hard conditioning.' : '';
      const wl = p.load ? ` Week ${p.wk}: ${p.load.lift.toLowerCase()}.` : '';
      items.push({t:`Today: ${lbl}.${wl}${adj}`, why: R.enough ? `Readiness ${R.score} (${R.finalZone}). Week load from plan §11.` : 'Log sleep, energy and soreness to get a readiness zone. Week load from plan §11.'});
    } else if (p.sessions.some(s => s.core)) items.push({t:'All core sessions for today are done or accounted for. Recover: protein, fluids, sleep.', why:'Optional work stays optional — no extra volume rewarded.'});
    else items.push({t:'Rest day: an easy walk and 10 min mobility are optional — not another workout. Good day for meal prep and the weekly review.', why:'Plan §12: keep 1 full rest day.'});
    const y = addDays(k, -1); const yp = planFor(y);
    if (!yp.pre && !items.some(i => i.act)){ const miss = yp.sessions.filter(s => s.core && sessStatus(y, s.key) === 'planned'); if (miss.length && dayStatus(y).s === 'missed') items.push({t:`Yesterday's ${miss.map(s => s.label).join(' + ')} wasn't logged. Skip it or move it to a rest day — never double up.`, why:'Plan §3: do not cram missed workouts into the next day.', act:['Move / skip', 'moveSession', y + '|' + miss[0].key]}); }
  }
  /* Keep the brief to 3 items: merge multiple session notes into item 1 */
  if (items.length > 1){ const a = items.find(i => i.act); items.splice(0, items.length, {t:items.map(i => i.t).join(' '), why:items.map(i => i.why).join(' '), act:a ? a.act : null}); }
  /* 2. Nutrition */
  const remP = t.p - N.p, remK = t.kcal - N.kcal;
  if (!N.n) items.push({t: hour < 11 ? 'Log breakfast — aim for 30–40 g protein (e.g. 3 eggs + mess breakfast + 250 ml milk).' : 'No food logged yet today. Estimates are fine — log honestly so the 14-day review works.', why:'Plan §9 sample menu; §10: estimate mess food conservatively and consistently.'});
  else if (remK < -150) items.push({t:`About ${fmt(-remK)} kcal over today's estimate. Next meal: normal portions — no fasting or compensation. Judge the weekly average.`, why:'Plan §10 “Do not use”: crash diets or compensation cycles.'});
  else if (remP > 25 && remK < remP * 4 * 1.8) items.push({t:`Protein short by ${fmt(remP)} g with ~${fmt(Math.max(0,remK))} kcal left → lean protein: ${PROTEIN_LEAN.slice(0,3).join('; ')}.`, why:'Rule: when calories are nearly used but protein is short, choose protein-dense, low-oil options over more starch.'});
  else if (remP > 25) items.push({t:`${fmt(remP)} g protein and ~${fmt(remK)} kcal left. Anchor the next meal with protein: ${PROTEIN_ANY.slice(0,3).join('; ')}.`, why:'Plan §8: 30–45 g protein in major meals; dal alone is not enough.'});
  else if (remK > 600 && hour >= 20) items.push({t:`~${fmt(remK)} kcal under target late in the day. Eat a normal dinner; repeated big shortfalls hurt recovery.`, why:'Rule: sustainable intake protects training and recovery.'});
  else items.push({t:`Nutrition on track: ${fmt(N.p)}/${t.p} g protein, ${fmt(N.kcal)}/${t.kcal} kcal.`, why:'Targets are editable estimates; the 14-day trend decides changes.'});
  /* 3. Recovery / adjustment */
  const rec = [];
  const mp = maxPain(d);
  if (mp >= 3 || redFlags(d).length) rec.push({t: redFlags(d).length ? 'Pain red flag logged — stop the aggravating activity; swelling, locking, giving way or pain with walking needs medical assessment.' : `Pain ${mp}/10 logged — use pain-free range and low-impact conditioning (bike/elliptical); avoid painful running, deep squats/lunges and jumping.`, why:'Plan §3 & §12 knee/joint warning signs. Not a diagnosis.'});
  if (d.illness) rec.push({t:'Illness logged — rest, fluids, normal meals. Return gradually once symptoms settle.', why:'Plan §10: severe fatigue, dizziness or illness → stop hard training.'});
  const sh = num(d.sleepH); if (isNum(sh) && sh < 6.5) rec.push({t:`Short sleep (${sh} h): lower volume, no failure; protect tonight's sleep (target ${t.sleep} h).`, why:'Plan §12: when duty disrupts sleep, adjust workload rather than compensate with stimulants.'});
  if (num(d.soreness) >= 7) rec.push({t:'High soreness — shift or shorten the session; avoid hard running the day after heavy legs.', why:'Plan §12.'});
  const wt = waterTotal(k); if (isToday && hour >= 14 && t.water && wt < t.water * 0.4) rec.push({t:`Fluids ${fmt(wt)}/${fmt(t.water)} ml — add a glass with each meal and around training. Drink to thirst; don't force it.`, why:'Plan §12 hydration: pale-yellow urine as a rough guide; electrolytes for long/hot sessions.', act:['+500 ml','addWater','500']});
  const cafLate = arr(d,'caffeine').find(c => { const bt = hmToMin(S.settings.caffeine.bedtime), ct = hmToMin(c.t); return isNum(bt) && isNum(ct) && ((bt - ct + 1440) % 1440) < (S.settings.caffeine.cutoffH||8) * 60; });
  if (cafLate) rec.push({t:`Caffeine at ${cafLate.t} is within ${S.settings.caffeine.cutoffH} h of your bedtime — may affect sleep.`, why:'Your caffeine cutoff setting (editable).'});
  const lowE = [1,2,3,4].map(i => addDays(k,-i)).filter(x => num(dayR(x).energy) <= 2 || (arr(dayR(x),'food').length >= 2 && dayNut(x).kcal < t.kcal * 0.7)).length;
  if (lowE >= 3) rec.push({t:'Low energy or low intake on 3 of the last 4 days — eat regular meals and review sleep before pushing harder.', why:'Rule: repeated low energy/missed meals → sustainable intake and recovery first.'});
  if (!rec.length){
    if (R.enough) rec.push({t:`Readiness ${R.score} — ${ZONE_TXT[R.finalZone]}.`, why:`Inputs: ${R.comps.map(c => c.n + ' ' + c.raw).join(', ')}. Simple weighted score; not clinically validated.`});
    else rec.push({t:'Log sleep, energy and soreness (Recovery) to get a readiness recommendation.', why:'Readiness is only calculated when sleep + 2 other inputs exist.'});
  }
  items.push(rec[0]);
  return items.slice(0, 3);
}

/* 14-day calorie review (plan §10 weekly calorie adjustment algorithm) */
function calReview(k){
  const A = avgRange('weight', k, 7), B = avgRange('weight', addDays(k,-7), 7), C = avgRange('weight', addDays(k,-14), 7);
  const t = targets();
  const out = {A, B, C};
  if (A.n < 4 || B.n < 4) return {...out, status:'insufficient', t:`Need ≥4 weigh-ins in each of the last two weeks (have ${A.n} and ${B.n}).`, why:'Plan: adjust from 14-day trends, not single weigh-ins.'};
  const rate = (B.avg - A.avg) / B.avg * 100; const prevRate = C.n >= 4 ? (C.avg - B.avg) / C.avg * 100 : null;
  let logged = 0, ok = 0; for (let i = 0; i < 14; i++){ const x = addDays(k,-i); if (arr(dayR(x),'food').length >= 2){ logged++; if (dayNut(x).kcal <= t.kcal * 1.1) ok++; } }
  const comp = Math.round(ok / 14 * 100);
  const wNow = lastValue('waist', k, 10), wOld = lastValue('waist', addDays(k,-14), 21);
  const waistD = (wNow && wOld && wNow.k !== wOld.k) ? wNow.v - wOld.v : null;
  const eAvg = mean(dayKeysRange(addDays(k,-6), k).map(x => num(dayR(x).energy)));
  const fatigue = isNum(eAvg) && eAvg <= 2.5;
  Object.assign(out, {rate, prevRate, comp, logged, waistD, eAvg});
  const rs = `${rate >= 0 ? 'loss' : 'gain'} ${fmt(Math.abs(rate),2)}%/week`;
  if (rate > 0.8 && (prevRate > 0.8 || fatigue)) return {...out, status:'add', t:`Fast loss (${rs}${isNum(prevRate) ? `; previous ${fmt(prevRate,2)}%` : ''})${fatigue ? ' with low energy' : ''}. Suggest +150–250 kcal/day or reduce hard conditioning/volume.`, why:'Plan §10: loss above ~0.8%/week for 2 weeks, fatigue or performance drop → add calories.', delta:200};
  if (fatigue && rate > 0.4) return {...out, status:'add', t:`Low energy (avg ${fmt(eAvg,1)}/5) with ${rs}. Consider +150 kcal/day or less hard conditioning.`, why:'Plan §10: fatigue or performance drop → add calories / reduce load.', delta:150};
  if (rate >= 0.4 && rate <= 0.7) return {...out, status:'keep', t:`On target: ${rs}. Keep calories and training unchanged.`, why:'Plan §10: 0.4–0.7%/week with stable strength → no change.'};
  if (rate < 0.25 && isNum(waistD) && waistD <= -1) return {...out, status:'keep', t:`Weight change small (${rs}) but waist down ${fmt(-waistD,1)} cm — likely recomposition. Continue; don't cut automatically.`, why:'Plan §10: weight stable but waist shrinking / strength improving → continue.'};
  if (rate < 0.25 && comp >= 85) return {...out, status:'reduce', t:`Slow loss (${rs}), waist ${isNum(waistD) ? (waistD <= -0.5 ? 'slightly down' : 'unchanged') : 'not measured'}, adherence ${comp}%. Choose ONE: reduce ~150–200 kcal/day OR add 10–15 min easy cardio twice a week.`, why:'Plan §10: loss below ~0.25%/week, waist unchanged, compliance ≥85% → one modest change.', delta:-150};
  if (rate < 0.25) return {...out, status:'adherence', t:`Slow loss (${rs}) but logging/adherence is ${comp}% (<85%). Tighten consistency before changing targets.`, why:'Plan §10 requires ≥85% compliance before reducing intake.'};
  if (rate < 0.4) return {...out, status:'keep', t:`Slightly slow (${rs}). Hold for another week and re-check.`, why:'Between plan bands; avoid frequent changes.'};
  return {...out, status:'keep', t:`Slightly fast (${rs}). Keep for now; watch energy, performance and hunger.`, why:'Between plan bands (0.7–0.8%).'};
}

/* Weekly review (7 days ending k) */
function weeklyReview(k){
  const from = addDays(k, -6); const keys = dayKeysRange(from, k); const t = targets();
  const ss = sessionsInRange(from, k); const adh = ss.planned ? Math.round(ss.done / ss.planned * 100) : null;
  const logged = keys.filter(x => arr(dayR(x),'food').length >= 2);
  const pDays = logged.filter(x => dayNut(x).p >= t.p * 0.95).length;
  const kAvg = mean(logged.map(x => dayNut(x).kcal)), pAvg = mean(logged.map(x => dayNut(x).p));
  const wt = weightTrend(k); const sl = mean(keys.map(x => num(dayR(x).sleepH)));
  const rd = mean(keys.map(x => readiness(x).score)); const painDays = keys.filter(x => maxPain(dayR(x)) >= 3).length;
  const runMin = sum(allRuns(from, k).map(r => (r.dur||0)/60)); const qDone = keys.filter(x => planKeys(x).includes('quality') && DONEISH.includes(sessStatus(x,'quality'))).length;
  const wins = [], misses = [];
  if (isNum(adh)) (adh >= 80 ? wins : misses).push(`Training sessions ${ss.done}/${ss.planned} (${adh}%; target 80–90%)`);
  if (logged.length) (pDays >= 6 ? wins : misses).push(`Protein target on ${pDays}/7 days (goal ≥6)`); else misses.push('Food not logged this week');
  if (isNum(sl)) (sl >= t.sleep - 0.5 ? wins : misses).push(`Sleep average ${fmt(sl,1)} h`);
  if (isNum(wt.delta)) (wt.delta < 0 ? wins : misses).push(`7-day avg weight ${wt.delta <= 0 ? '' : '+'}${fmt(wt.delta,2)} kg vs prior week`);
  if (painDays) misses.push(`Pain ≥3/10 on ${painDays} day(s)`); else wins.push('No pain ≥3/10 logged');
  if (runMin) wins.push(`${fmt(runMin)} min running/cardio logged`);
  const scores = [['training', isNum(adh) ? adh : null],['protein', logged.length ? pDays/7*100 : 0],['sleep', isNum(sl) ? sl/t.sleep*100 : null],['logging', logged.length/7*100]].filter(x => isNum(x[1]));
  scores.sort((a,b) => a[1] - b[1]); const bott = scores[0] ? scores[0][0] : null;
  const CHANGE = {training:'Plan sessions around duty: pick fixed training windows and use the 35–45 min templates on busy days.', protein:'Add one fixed protein anchor daily (e.g. whey + milk mid-morning, or 3 eggs at breakfast).', sleep:'Protect sleep: set a consistent lights-out time and cut caffeine after your cutoff.', logging:'Log every meal for 7 days, even rough mess estimates — the 14-day review needs it.'};
  const nwk = weekOf(programDay(addDays(k,1)));
  return {from, k, ss, adh, pDays, logged:logged.length, kAvg, pAvg, wt, sl, rd, painDays, runMin, qDone, wins, misses, bott, change: bott ? CHANGE[bott] : 'Keep the same plan — consistency is working.', nwk, next: nwk >= 1 && nwk <= 16 ? `Week ${nwk}: ${WEEK_LOAD[nwk].lift}; run: ${WEEK_LOAD[nwk].run}; quality: ${qualityFor(nwk).t}.` : nwk > 16 ? 'Post-program: plan the next phase from your 16-week review.' : 'Program not started yet.'};
}

/* Streaks — rest days count as on-plan; never shame */
function streaks(k){
  let cons = 0; let x = dayStatus(k).s === 'completed' || dayStatus(k).s === 'rest' ? k : addDays(k, -1);
  for (let i = 0; i < 400; i++){ const p = planFor(x); if (p.pre) break; const s = dayStatus(x).s; if (['completed','modified','rest'].includes(s)) cons++; else break; x = addDays(x, -1); }
  let logS = 0; x = (num(dayR(k).weight) || arr(dayR(k),'food').length) ? k : addDays(k,-1);
  for (let i = 0; i < 400; i++){ const d = dayR(x); if (isNum(num(d.weight)) || arr(d,'food').length) logS++; else break; x = addDays(x,-1); }
  return {cons, logS};
}

/* Badges reward adherence, recovery and consistency — not just weight loss or volume */
function badges(){
  const days = Object.keys(S.days).sort(); const k = todayKey();
  const workouts = days.flatMap(x => arr(S.days[x],'workouts').filter(w => w.status === 'completed' || w.status === 'partial'));
  const st = streaks(k); const t = targets();
  const protDays = days.filter(x => arr(S.days[x],'food').length >= 2 && dayNut(x).p >= t.p*0.95).length;
  const qRuns = days.flatMap(x => arr(S.days[x],'runs')).filter(r => HARD_TYPES.includes(r.type)).length;
  const restRed = days.filter(x => readiness(x).finalZone === 'red' && !arr(S.days[x],'workouts').some(w => w.status === 'completed')).length;
  const w0 = lastValue('waist', addDays(S.settings.startDate,-1), 30), wN = lastValue('waist', k, 60);
  const B = [
    ['🧭','Baseline set','Day 0 weigh-in and waist logged', !!(w0 && lastValue('weight', addDays(S.settings.startDate,-1), 30))],
    ['📝','Honest logger','7-day logging streak', st.logS >= 7],
    ['🔁','Consistent','14 days on plan (rest days count)', st.cons >= 14],
    ['🥚','Protein habit','Protein target hit on 20 days', protDays >= 20],
    ['🏋️','10 sessions','10 strength/calisthenics sessions completed', workouts.length >= 10],
    ['⚡','Quality runner','5 tempo/interval sessions logged', qRuns >= 5],
    ['🛌','Recovery respected','Rested on a red-readiness day', restRed >= 1],
    ['📏','Waist −2 cm','Waist down 2 cm from baseline', !!(w0 && wN && w0.v - wN.v >= 2)],
    ['🧯','Deload done','Completed week 11 deload sessions', (() => { const a = addDays(S.settings.startDate, 70), b = addDays(a, 6); const s = sessionsInRange(a, b); return b < k && s.planned && s.done / s.planned >= 0.7; })()],
    ['💾','Backed up','Exported a backup', !!S.meta.lastBackup]
  ];
  return B.map(b => ({ic:b[0], name:b[1], desc:b[2], got:!!b[3]}));
}

/* ===== Training: sessions, set logging, templates, library, history, timers ===== */
'use strict';
function findWorkout(id){ for (const [k, d] of Object.entries(S.days)) for (const w of arr(d,'workouts')) if (w.id === id) return w; return null; }
function findWorkoutDay(id){ for (const [k, d] of Object.entries(S.days)) if (arr(d,'workouts').some(w => w.id === id)) return k; return null; }
function getEx(el){ const w = findWorkout(el.dataset.w); const ex = w && w.ex.find(e => e.id === el.dataset.e); return {w, ex}; }
function newWorkout(tplId, key, k){
  const t = S.templates[tplId]; const wk = planFor(k).wk;
  const w = {id:uid(), key:key || null, tpl:tplId || null, name: t ? t.name : 'Custom workout', status:'started', startTs:Date.now(), pausedMs:0, warm:{}, devs:[], ex:[]};
  if (t) for (const te of t.ex){ const ps = (key && !te.optional) ? plannedSets(te.sets, wk) : te.sets; w.ex.push({id:uid(), exId:te.exId, pSets:ps, repMin:te.repMin, repMax:te.repMax, rir:te.rir, rest:te.rest, optional:te.optional, note:te.note, sets:Array.from({length:ps}, () => ({done:false}))}); }
  const d = dayW(k); d.workouts = arr(d,'workouts'); d.workouts.push(w); return w;
}
ACT.openWorkout = el => {
  const key = el.dataset.arg; const k = UI.date; closeModal();
  let w = arr(dayR(k),'workouts').find(x => x.key === key);
  if (!w){ const s = sessionInfo(key, planFor(k).wk); if (!s || !s.tpl) return toast('No template for this session.'); w = newWorkout(s.tpl, key, k); save(); toast(`${s.label} started${s.setF !== 1 ? ` — sets × ${s.setF} for week ${planFor(k).wk}` : ''}.`); }
  UI.openW = w.id; go('training', 'session');
};
ACT.newCustomWorkout = () => {
  const tpl = mval('tplSel') || ($('#tplSel') || {}).value || ''; const w = newWorkout(tpl || null, null, UI.date);
  if (!tpl) w.name = 'Custom workout'; UI.openW = w.id; save(); closeModal(); render();
};

function setPlaceholders(ex, k){
  const h = exHistory(ex.exId, k)[0]; if (!h) return [];
  const ws = workingSets(h.ex); return ex.sets.map((s, i) => ws[Math.min(i, ws.length - 1)] || {});
}

  const {w, ex} = getEx(el); if (!ex) return '';

  return `<span class="small">${ws.length}/${ex.pSets} working sets${isNum(vol) && vol ? ` · volume ${fmt(vol)} kg` : ''}${e.type === 'bw' ? ` · ${fmt(sum(ws.map(s=>num(s.r))))} reps` : ''}</span>`;

    <div class="exHead"><div class="grow"><h4>${esc(e.name)} ${ex.optional ? chip('optional') : ''} ${ex.dev ? chip('modified','warn') : ''}</h4>
      <div class="small">${esc(e.muscle)} · ${esc(e.equip)} · planned <b>${ex.pSets} × ${ex.repMin}${ex.repMax!==ex.repMin?'–'+ex.repMax:''}${e.type==='time'?' s':''}</b> · RIR ${esc(ex.rir)} · rest ${fmtDur(ex.rest)}</div>

const CALI_IDS = ['pullup','strictPull','negPull','scapPull','pushup','dip','hollow','handstand','hkr','walkLunge','gluteBridge','abWheel','sidePlank','deadBug'];

}

  const bench = Object.entries(S.days).flatMap(([kk, d]) => arr(d,'bench').map(b => ({...b, k:kk}))).sort((a,b) => a.k < b.k ? 1 : -1);
  const lastB = bench[0]; const since = lastB ? diffDays(lastB.k, k) : null;
  const pushBest = byMove.pushup ? byMove.pushup.best : null;
  return `<div class="grid md2">

/* ---------- History & PRs ---------- */
function historyView(){
  const k = todayKey(); const prs = {};
  for (const [kk, d] of Object.entries(S.days)) for (const w of arr(d,'workouts')) for (const ex of w.ex || []) for (const s of workingSets(ex)){
    const e = exById(ex.exId); const p = prs[ex.exId] = prs[ex.exId] || {best:null, bestK:null, topW:null, topR:null, last:null, maxReps:null};
    const v = e1rm(num(s.w), num(s.r)); if (e.type === 'load' && isNum(v) && (!isNum(p.best) || v > p.best)){ p.best = v; p.bestK = kk; p.topW = s.w; p.topR = s.r; }
    if (e.type !== 'load' && (!isNum(p.maxReps) || (num(s.r)||0) > p.maxReps)){ p.maxReps = num(s.r); p.bestK = kk; }
    if (!p.last || kk > p.last) p.last = kk;
  }
  const weeks = []; for (let i = 7; i >= 0; i--){ const end = addDays(k, -7*i), st = addDays(end, -6); let vol = 0, sets = 0; for (const x of dayKeysRange(st, end)) for (const w of arr(dayR(x),'workouts')){ const s = workoutStats(w); vol += s.vol; sets += s.done; } weeks.push({label:fmtDate(st,{day:'numeric',month:'short'}), v:vol, sets}); }
  const sessions = Object.entries(S.days).flatMap(([kk, d]) => arr(d,'workouts').map(w => ({k:kk, w}))).sort((a,b) => a.k < b.k ? 1 : -1).slice(0, 30);
  return `<div class="card"><h3>Weekly volume</h3>${barChart({bars:weeks, summary:`Volume = load × reps of completed working sets with external load. Last week: ${fmt(weeks[7].v)} kg in ${weeks[7].sets} working sets.`})}</div>
  <div class="card" style="margin-top:12px"><h3>Personal records</h3>${Object.keys(prs).length ? `<div class="tblwrap"><table class="tbl"><thead><tr><th>Exercise</th><th>Best set</th><th>Est. 1RM*</th><th>Last done</th></tr></thead><tbody>${Object.entries(prs).sort((a,b)=> (b[1].last||'') < (a[1].last||'') ? -1 : 1).map(([id,p]) => `<tr><td>${esc(exById(id).name)}</td><td>${isNum(p.best) ? `${fmt(num(p.topW),1)} × ${p.topR}` : isNum(p.maxReps) ? `${p.maxReps} ${exById(id).type==='time'?'s':'reps'}` : '—'}</td><td>${fmt(p.best,1)}</td><td>${p.last ? fmtDate(p.last,{day:'numeric',month:'short'}) : '—'}</td></tr>`).join('')}</tbody></table></div><p class="small">*Epley estimate (load × (1 + reps/30)) — a trend indicator, not a max test.</p>` : empty('Log working sets to see PRs.')}</div>
  <div class="card" style="margin-top:12px"><h3>Recent sessions</h3>${sessions.length ? `<ul class="list">${sessions.map(({k:kk,w}) => { const s = workoutStats(w); return `<li><div class="grow"><b>${esc(w.name)}</b><div class="small">${fmtDate(kk)} · ${s.done}/${s.planned} sets · ${fmt(s.vol)} kg${isNum(workoutElapsed(w)) ? ' · ' + fmtMin(workoutElapsed(w)) : ''}${w.rpe ? ' · sRPE ' + w.rpe : ''}</div></div>${stChip(w.status)}<button class="btn sm" data-act="goView" data-view="training" data-sub="session" data-date="${kk}">Open</button></li>`; }).join('')}</ul>` : empty('No sessions yet.')}</div>`;
}

ACT.ivStart = () => {
  const g = id => num(($('#' + id) || {}).value); const reps = g('ivReps'), work = g('ivWork'), rec = g('ivRec') ?? 0, warm = (g('ivWarm') ?? 0) * 60, cool = (g('ivCool') ?? 0) * 60;

/* ===== Nutrition: Indian / mess food log, hydration, custom foods, targets & adaptive review ===== */
'use strict';
function defaultMeal(){ const h = new Date().getHours(); return h < 10 ? 'Breakfast' : h < 12 ? 'Mid-morning' : h < 15 ? 'Lunch' : h < 18 ? 'Pre-workout' : h < 22 ? 'Dinner' : 'Late snack'; }
const confChip = e => e.conf === 'low' ? chip('est. low','warn') : e.src === 'mess' ? chip('est.','') : e.src === 'user' || e.src === 'verified' ? chip(e.src === 'verified' ? 'label' : 'user','info') : '';

LIVE.nutSum = () => {
  const N = dayNut(UI.date), t = targets();
  const macroK = N.p*4 + N.c*4 + N.f*9;
  const row = (l, v, tg, u, cls='') => `<div><div class="row between small"><span>${l}</span><span class="num">${fmt(v)} / ${fmt(tg)} ${u}</span></div>${bar(v, tg, cls)}</div>`;
  return `<div class="row between"><div><div class="label">Calories (estimate)</div><div class="kpi num">${fmt(N.kcal)}<small> / ${fmt(t.kcal)} kcal</small></div></div>
    <div class="small" style="text-align:right">${N.kcal <= t.kcal ? `<b>${fmt(t.kcal - N.kcal)}</b> remaining` : `<b>${fmt(N.kcal - t.kcal)}</b> over`}${N.low ? `<br>Range ≈ ${fmt(N.range[0])}–${fmt(N.range[1])} kcal` : ''}</div></div>
    ${bar(N.kcal, t.kcal, N.kcal > t.kcal*1.1 ? 'warn' : '')}
    <div class="stack" style="margin-top:10px">${row('Protein', N.p, t.p, 'g', N.p >= t.p*0.95 ? 'ok' : '')}${row('Carbs', N.c, t.c, 'g')}${row('Fat', N.f, t.f, 'g')}${isNum(t.fib) ? row('Fibre', N.fib, t.fib, 'g') : ''}</div>
    <p class="small">Sugar ${fmt(N.sug)} g · Sodium ${fmt(N.na)} mg${isNum(t.na) ? ` / ${fmt(t.na)}` : ''} · ${N.n} item(s)${N.low ? ` · ${N.low} low-confidence` : ''}</p>
    <p class="small faint">Macro-derived energy ${fmt(macroK)} kcal vs listed ${fmt(N.kcal)} — they differ slightly because of fibre, rounding and database energy factors.</p>`;
};

function readQtyForm(e){
  const qty = num(mval('qty')); const g = mval('g') != null ? num(mval('g')) : e.g;
  if (!isNum(qty) || qty <= 0) return {err:'Enter an amount above 0.'}; if (!isNum(g) || g <= 0) return {err:'Grams per unit must be above 0.'};
  const n = {}; let changed = false; for (const k of NUT_KEYS){ const v = num(mval('n_' + k)); n[k] = isNum(v) ? v : 0; if (Math.abs((r1(e.n[k])||0) - n[k]) > 0.05) changed = true; }
  if (n.kcal < 0 || n.p < 0) return {err:'Nutrition values cannot be negative.'};
  return {qty, g, n, changed, unit:mval('unit'), meal:mval('meal'), conf:mval('conf')};
}

ACT.saveCustomFood = () => {
  const name = (mval('name')||'').trim(); if (!name) return toast('Name required.');
  const n = {}; for (const k of NUT_KEYS) n[k] = num(mval('n_' + k)) ?? 0; if (!n.kcal && !n.p) return toast('Enter at least kcal or protein.');
  if (allFoods().some(f => f.name.toLowerCase() === name.toLowerCase())) return toast('A food with this name exists.');
  const per = +mval('basis'); const sname = (mval('sname')||'serving').trim() || 'serving'; const sg = num(mval('sg')) || 100;
  const f = {id:'f_' + uid(), name, cat:mval('cat'), n, per, ub: per === 1, units: per === 1 ? {[sname]:1} : {[sname]:sg, g:1}, src:mval('src')};

CHG.importFoods = el => {
  const file = el.files && el.files[0]; if (!file) return; const rd = new FileReader();
  rd.onload = () => { try { const a = JSON.parse(rd.result); if (!Array.isArray(a)) throw new Error('Expected a JSON array.'); let add = 0, skip = 0;
      for (const o of a){ const name = String(o.name||'').trim(); const kcal = num(o.kcal); if (!name || !isNum(kcal) || kcal < 0){ skip++; continue; } if (allFoods().some(f => f.name.toLowerCase() === name.toLowerCase())){ skip++; continue; }
        const per = num(o.per) === 1 ? 1 : 100; const unit = String(o.unit || (per === 1 ? 'serving' : 'g')); const grams = num(o.grams) || (per === 1 ? 1 : 100);
        S.foods.push({id:'f_' + uid(), name, cat:String(o.cat||'Imported'), n:{kcal, p:num(o.p)||0, c:num(o.c)||0, f:num(o.f)||0, fib:num(o.fib)||0, sug:num(o.sug)||0, na:num(o.na)||0}, per, ub:per === 1, units: per === 1 ? {[unit]:1} : {[unit]:grams, g:1}, src:'user'}); add++; }
      save(); render(); toast(`Imported ${add} food(s); skipped ${skip}.`); } catch(e){ toast('Import failed: ' + e.message + ' Nothing was changed.'); } };
  rd.readAsText(file); el.value = '';
};

const IDB = {db:null,
  open(){ return new Promise((res, rej) => { if (this.db) return res(this.db); if (!window.indexedDB) return rej(new Error('IndexedDB unavailable')); const r = indexedDB.open('tos_photos', 1); r.onupgradeneeded = () => r.result.createObjectStore('photos', {keyPath:'id'}); r.onsuccess = () => { this.db = r.result; res(this.db); }; r.onerror = () => rej(r.error); }); },
  async tx(mode, fn){ const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('photos', mode); const st = t.objectStore('photos'); const out = fn(st); t.oncomplete = () => res(out && out.result !== undefined ? out.result : out); t.onerror = () => rej(t.error); }); },
  put(o){ return this.tx('readwrite', s => s.put(o)); }, del(id){ return this.tx('readwrite', s => s.delete(id)); },
  async get(id){ const db = await this.open(); return new Promise((res, rej) => { const r = db.transaction('photos').objectStore('photos').get(id); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async all(){ const db = await this.open(); return new Promise((res, rej) => { const r = db.transaction('photos').objectStore('photos').getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error); }); },
  async clear(){ return this.tx('readwrite', s => s.clear()); }
};

    <label class="fld full">Mess / canteen availability<input data-bind="set:diet.mess" value="${esc(s.diet.mess)}"></label>
    <label class="fld">Calories (kcal)<input type="number" inputmode="numeric" min="1200" max="5000" data-bind="tg:kcal" data-t="num" data-rerender="1" value="${esc(tg.kcal)}"></label>
    <label class="fld">Protein (g)<input type="number" inputmode="numeric" min="40" max="350" data-bind="tg:protein" data-t="num" data-rerender="1" value="${esc(tg.protein)}"></label>
    <label class="fld">Fat (g)<input type="number" inputmode="numeric" min="20" max="200" data-bind="tg:fat" data-t="num" data-rerender="1" value="${esc(tg.fat)}"></label>
    <label class="fld">Fibre (g)<input type="number" inputmode="numeric" min="0" max="80" data-bind="tg:fiber" data-t="num" value="${esc(tg.fiber)}"></label></div>
    <div class="note" style="margin-top:10px">Carbs fill the rest: (${fmt(t.kcal)} − ${t.p}×4 − ${t.f}×9) ÷ 4 = <b>${t.c} g</b>. Plan starting ranges: 2,300–2,500 kcal, protein 150–170 g, fat 60–75 g, fibre 25–35 g. These are estimates; the 14-day review adjusts them. <button class="btn sm" data-act="onbDefaults">Use plan midpoints</button></div>`;
  if (st === 2) body = `<h2>3 · Training, recovery & supplements</h2><div class="fields">
    <label class="fld full">Equipment<input data-bind="set:equipment" value="${esc(s.equipment)}"></label><label class="fld full">Current run level<input data-bind="set:runLevel" value="${esc(s.runLevel)}"></label>
    <label class="fld">Strict pull-ups now<input type="number" inputmode="numeric" min="0" max="60" data-bind="set:pullupLevel" data-t="num" value="${esc(s.pullupLevel)}"></label>
    <label class="fld">Fluid target (ml)<input type="number" inputmode="numeric" min="500" max="8000" data-bind="tg:water" data-t="num" value="${esc(tg.water)}"></label>
    <label class="fld">Sleep goal (h)<input type="number" inputmode="decimal" min="4" max="12" step="0.25" data-bind="tg:sleep" data-t="num" value="${esc(tg.sleep)}"></label>
    <label class="fld">Steps target (optional)<input type="number" inputmode="numeric" min="0" max="50000" data-bind="tg:steps" data-t="num" value="${esc(tg.steps)}"></label>
    <label class="fld full">Pain / injury limitations (optional)<input data-bind="set:painNotes" value="${esc(s.painNotes)}" placeholder="e.g. past running knee pain"></label></div>
    <p class="small">Weekly schedule follows the plan: Mon easy run + Upper A · Tue Lower A · Wed quality run + calisthenics skill · Thu Upper B · Fri easy run · Sat Lower B + optional finisher · Sun rest. Edit in Settings → Schedule.</p>
    <h4>Supplements (optional — nothing is added unless you tap)</h4><div class="row"><button class="btn sm" data-act="addSupp" data-p="creatine">+ Creatine 3–5 g/day</button><button class="btn sm" data-act="addSupp" data-p="whey">+ Whey as needed</button></div>
    <p class="small">${s.supplements.length ? 'Added: ' + s.supplements.map(x => esc(x.name)).join(', ') : 'None added.'}</p>`;
  if (st === 3) body = `<h2>4 · Day 0 baseline</h2><p class="small">Tick what you've done; you can finish the rest later from Settings → Profile.</p>${BASELINE.map(([k,l]) => `<label class="check"><input type="checkbox" data-bind="set:baseline.${k}" data-t="bool" ${s.baseline[k]?'checked':''}> ${esc(l)}</label>`).join('')}
    <div class="note" style="margin-top:10px"><b>Progress photos:</b> every 2 weeks — front, side, back; same light, camera height, distance, posture and time of day. Stored only on this device (Progress → Photos).</div>
    <div class="note" style="margin-top:8px"><b>Data:</b> everything stays in this browser. Export a backup weekly (Settings → Data). On iPhone, add the page to your Home Screen for quick access.</div>`;
  return `<div class="onb"><div class="card"><h1>Transformation OS — setup</h1>${steps}${body}${nav}</div></div>`;
};
ACT.onbStep = el => { UI.onbStep = clamp(UI.onbStep + (+el.dataset.d), 0, 3); render(); window.scrollTo({top:0}); };
ACT.onbDefaults = () => { Object.assign(S.settings.targets, {kcal:2400, protein:160, fat:68, carbMode:'auto', fiber:30}); save(); render(); };
ACT.onbSkip = () => { S.settings.onboarded = true; save(); UI.view = 'today'; render(); toast('Setup skipped — defaults in use. Complete it anytime.'); };
ACT.onbFinish = () => {
  const s = S.settings, p = s.profile; const k0 = addDays(s.startDate, -1);
  const d0 = dayR(k0); const need = (isNum(num(p.startWeight)) && d0.weight == null) || (isNum(num(p.waist)) && d0.waist == null);
  if (need){ const d = dayW(k0); if (d.weight == null && isNum(num(p.startWeight))) d.weight = num(p.startWeight); if (d.waist == null && isNum(num(p.waist))) d.waist = num(p.waist); if (d.hip == null && isNum(num(p.hip))) d.hip = num(p.hip); if (d.rhr == null && isNum(num(p.rhr))) d.rhr = num(p.rhr); }
  s.onboarded = true; save(); UI.view = 'today'; UI.date = todayKey(); render(); toast('Setup complete. Day 0 baseline saved.');
};

/* ===== Boot ===== */
'use strict';
function buildShell(){
  $('#sidenav').innerHTML = `<div class="brand">TRANSFORMATION <span>OS</span></div>` + NAV.map(([id,l,ic]) => `<button data-act="nav" data-nav="${id}"><span aria-hidden="true">${ic}</span>${l}</button>`).join('') +
    `<div style="flex:1"></div><button data-act="theme"><span aria-hidden="true">🌓</span>Toggle theme</button>`;
  $('#bottomnav').innerHTML = MOBILE_NAV.map(id => { const n = NAV.find(x => x[0] === id) || ['more','More','☰']; return `<button data-act="nav" data-nav="${n[0]}"><span class="ic" aria-hidden="true">${n[2]}</span>${n[1]}</button>`; }).join('');
}
/* Home Screen install support, generated at runtime so the app stays a single file:
   app icon (apple-touch-icon + favicon) drawn on a canvas, and a web app manifest served from a Blob URL. */
function makeIcon(size){
  const c = document.createElement('canvas'); c.width = c.height = size; const g = c.getContext('2d'); if (!g) return null;
  g.fillStyle = '#0d1117'; g.fillRect(0, 0, size, size);
  const u = size / 100; g.strokeStyle = '#4da3ff'; g.lineWidth = 7*u; g.lineCap = 'round';
  g.beginPath(); g.arc(50*u, 50*u, 34*u, Math.PI*0.75, Math.PI*2.25); g.stroke();
  g.fillStyle = '#b7f34a'; g.beginPath(); g.moveTo(28*u, 64*u); g.lineTo(44*u, 48*u); g.lineTo(54*u, 57*u); g.lineTo(72*u, 36*u); g.lineTo(72*u, 48*u); g.lineTo(54*u, 68*u); g.lineTo(44*u, 59*u); g.lineTo(33*u, 70*u); g.closePath(); g.fill();
  g.fillStyle = '#e8eef6'; g.font = `bold ${15*u}px -apple-system, Segoe UI, Roboto, sans-serif`; g.textAlign = 'center'; g.fillText('OS', 50*u, 92*u);
  try { return c.toDataURL('image/png'); } catch(e){ return null; }
}
function setupInstall(){
  try {
    /* Hosted build (GitHub Pages): static manifest, icons and sw.js sit next to the page. */
    if (/^https?:$/.test(location.protocol) && document.querySelector('link[rel="manifest"]')){
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
      return;
    }
    /* Opened as a lone file: drop the static links (they would 404) and generate everything at runtime. */
    document.querySelectorAll('link[rel="manifest"],link[rel="apple-touch-icon"],link[rel="icon"]').forEach(l => l.remove());
    const i180 = makeIcon(180), i192 = makeIcon(192), i512 = makeIcon(512); if (!i180) return;
    const add = (rel, href, extra={}) => { const l = document.createElement('link'); l.rel = rel; l.href = href; for (const [k,v] of Object.entries(extra)) l.setAttribute(k, v); document.head.appendChild(l); };
    add('apple-touch-icon', i180, {sizes:'180x180'}); add('icon', i192, {type:'image/png'});
    const here = location.href.split('#')[0].split('?')[0];
    if (/^https?:/.test(here)){
      const manifest = {name:'Transformation OS', short_name:'Transform OS', description:'16-week athletic transformation tracker', start_url:here, scope:here.replace(/[^/]*$/, ''), display:'standalone', orientation:'portrait', background_color:'#0d1117', theme_color:'#0d1117',
        icons:[{src:i192, sizes:'192x192', type:'image/png', purpose:'any'},{src:i512, sizes:'512x512', type:'image/png', purpose:'any'}]};
      add('manifest', URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'})));
      /* Optional offline upgrade: if a sw.js file is ever placed next to this page, it is used; if not, nothing happens. */
      if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  } catch(e){ console.info('Install helpers unavailable', e); }
}
function boot(){
  const r = load(); applyTheme(); buildShell(); setupInstall();
  if (!r.ok) setTimeout(() => toast(r.msg), 400);
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then(g => { S.meta.persisted = !!g; }).catch(() => {}); } catch(e){}
  if (S.meta.lastSaved) savedLabel(true); else $('#saved').textContent = 'Not saved yet — data saves automatically on every change';
  render();
}
window.TOS = {get S(){ return S; }, UI, render, saveNow, planFor, dayNut, readiness, coachBrief, calReview, weeklyReview, validateBackup, mergeState};
boot();
